<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root { --canvas: #f3f4f6; --surface: #ffffff; --surface-muted: #f6f7f9; --nav-hover: #e8eaee; --line: #e3e5ea; --line-control: #868d9a; --ink: #1a1e26; --ink-muted: #545b69; --accent: #284887; --accent-hover: #1f3a70; --accent-soft: #e8edf8; --on-accent: #ffffff; --focus: var(--accent); --success: #1d7448; --success-soft: #e4f3ea; --warning: #8f5300; --warning-soft: #fcf0d9; --danger: #b42318; --danger-soft: #fcebea; --neutral: var(--ink-muted); --neutral-soft: #edeff2; --chart-fill: rgba(40, 72, 135, 0.12); --chart-2: #7a8394; --scrim: rgba(16, 18, 23, 0.40); --shadow-drawer: -8px 0 24px rgba(16, 18, 23, 0.12); --shadow-modal: 0 12px 32px rgba(16, 18, 23, 0.18); --shadow-popover: 0 4px 12px rgba(16, 18, 23, 0.12); --c1: #284887; --c2: #5f80c4; --c3: #9db3e0; --c4: #8f5300; --c5: #d9a24f; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --sidebar-width: 232px; --topbar-height: 52px; --drawer-width: 440px; --control-height: 32px; --content-min-width: 1280px; --font-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --canvas: #101217; --surface: #171a20; --surface-muted: #1e222a; --nav-hover: #23272f; --line: #2a2f38; --line-control: #6c7381; --ink: #e7e9ed; --ink-muted: #a2a8b4; --accent: #94aeea; --accent-hover: #aec2f0; --accent-soft: #1d2945; --on-accent: #0f1629; --focus: var(--accent); --success: #62c792; --success-soft: #13301f; --warning: #eeb257; --warning-soft: #38290f; --danger: #f08a80; --danger-soft: #3b1a18; --neutral: var(--ink-muted); --neutral-soft: #262a33; --chart-fill: rgba(148, 174, 234, 0.16); --chart-2: #7d8596; --scrim: rgba(0, 0, 0, 0.60); --shadow-drawer: -8px 0 24px rgba(0, 0, 0, 0.50); --shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.60); --shadow-popover: 0 4px 12px rgba(0, 0, 0, 0.50); --c1: #94aeea; --c2: #5f7fc4; --c3: #3b5694; --c4: #eeb257; --c5: #9c6a1f; color-scheme: dark; } }
:root[data-theme="dark"] { --canvas: #101217; --surface: #171a20; --surface-muted: #1e222a; --nav-hover: #23272f; --line: #2a2f38; --line-control: #6c7381; --ink: #e7e9ed; --ink-muted: #a2a8b4; --accent: #94aeea; --accent-hover: #aec2f0; --accent-soft: #1d2945; --on-accent: #0f1629; --focus: var(--accent); --success: #62c792; --success-soft: #13301f; --warning: #eeb257; --warning-soft: #38290f; --danger: #f08a80; --danger-soft: #3b1a18; --neutral: var(--ink-muted); --neutral-soft: #262a33; --chart-fill: rgba(148, 174, 234, 0.16); --chart-2: #7d8596; --scrim: rgba(0, 0, 0, 0.60); --shadow-drawer: -8px 0 24px rgba(0, 0, 0, 0.50); --shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.60); --shadow-popover: 0 4px 12px rgba(0, 0, 0, 0.50); --c1: #94aeea; --c2: #5f7fc4; --c3: #3b5694; --c4: #eeb257; --c5: #9c6a1f; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--surface); color: var(--ink); }

/* 문화관람 관리자 — 컴포넌트 스타일. 값은 모두 tokens.css의 변수에서 온다. */

.ad, .ad *, .ad *::before, .ad *::after { box-sizing: border-box; }
.ad {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 21px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
.ad-preview { margin: 0; background: var(--surface); }
.ad-preview > .ad { padding: var(--space-4); }
.ad :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ad svg.lucide { width: 16px; height: 16px; flex: none; stroke-width: 1.75; }
.ad .mono { font-family: var(--font-mono); font-size: 12px; line-height: 18px; }
.ad .muted { color: var(--ink-muted); }
.ad .num { text-align: right; }

/* ---------- 레이아웃 셸 ---------- */
.ad-shell {
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  grid-template-rows: var(--topbar-height) minmax(0, 1fr);
  min-height: 100%;
  background: var(--surface);
}
.ad-topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: 0 var(--space-4);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.ad-brand {
  display: inline-flex; align-items: center; gap: var(--space-2);
  font-size: 15px; font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em;
}
.ad-brand small { font-size: 12px; font-weight: 500; color: var(--ink-muted); letter-spacing: 0; }
.ad-user { display: flex; align-items: center; gap: var(--space-3); font-size: 13px; }
.ad-user .mono { color: var(--ink); }
.ad-main {
  display: flex; flex-direction: column; gap: var(--space-5);
  min-width: 0;
  padding: var(--space-6) var(--space-8) var(--space-10);
}

/* ---------- 사이드 내비게이션 ---------- */
.ad-sidenav {
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--space-3) var(--space-2);
  background: var(--canvas);
  border-right: 1px solid var(--line);
}
.ad-nav-group {
  padding: var(--space-4) 10px 6px;
  font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.04em;
  color: var(--ink-muted);
}
.ad-nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 34px; padding: 0 10px;
  border-radius: var(--radius-md);
  font-size: 13.5px; color: var(--ink); text-decoration: none;
}
.ad-nav-item svg.lucide { color: var(--ink-muted); }
.ad-nav-item:hover { background: var(--nav-hover); }
.ad-nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ad-nav-item[aria-current="page"] svg.lucide { color: var(--accent); }

/* ---------- 화면 머리 ---------- */
.ad-pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
.ad-pagehead h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.ad-pagehead p { margin: 2px 0 0; font-size: 13px; line-height: 20px; color: var(--ink-muted); }
.ad-pagehead__side { display: flex; align-items: center; gap: var(--space-3); flex: none; }
.ad-stamp { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.ad-stamp svg.lucide { width: 14px; height: 14px; }

/* ---------- 버튼 ---------- */
.ad-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--control-height); padding: 0 var(--space-3);
  border: 1px solid var(--line-control); border-radius: var(--radius-md);
  background: var(--surface); color: var(--ink);
  font: 500 13px/1 var(--font-sans); white-space: nowrap; cursor: pointer;
}
.ad-btn:hover { background: var(--surface-muted); }
.ad-btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ad-btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.ad-btn--ghost { background: transparent; border-color: transparent; color: var(--ink-muted); }
.ad-btn--ghost:hover { background: var(--surface-muted); color: var(--ink); }
.ad-btn--danger { color: var(--danger); border-color: var(--danger); }
.ad-btn--danger:hover { background: var(--danger-soft); }
.ad-btn--sm { height: 28px; padding: 0 10px; font-size: 12px; }
.ad-btn--icon { width: var(--control-height); padding: 0; }
.ad-btn:disabled, .ad-btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
.ad-btn:disabled:hover { background: var(--surface); }
.ad-btn--primary:disabled:hover { background: var(--accent); }
.ad-btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }

/* ---------- 입력·선택 ---------- */
.ad-field { display: grid; gap: 6px; min-width: 0; }
.ad-label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-muted); }
.ad-label .req { color: var(--danger); margin-left: 2px; }
.ad-input, .ad-select, .ad-textarea {
  width: 100%; height: var(--control-height); padding: 0 10px;
  border: 1px solid var(--line-control); border-radius: var(--radius-md);
  background: var(--surface); color: var(--ink);
  font: 400 13px/20px var(--font-sans);
}
.ad-textarea { height: auto; min-height: 88px; padding: 6px 10px; resize: vertical; }
.ad-input::placeholder, .ad-textarea::placeholder { color: var(--ink-muted); }
.ad-input[readonly] { background: var(--surface-muted); }
.ad-input[aria-invalid="true"] { border-color: var(--danger); }
.ad-help { font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.ad-error { display: flex; align-items: center; gap: var(--space-1); font-size: 12px; line-height: 18px; color: var(--danger); }
.ad-error svg.lucide { width: 14px; height: 14px; }
.ad-control { position: relative; display: block; min-width: 0; }
.ad-control > svg.lucide { position: absolute; top: 50%; transform: translateY(-50%); color: var(--ink-muted); pointer-events: none; }
.ad-control > svg.lucide:first-child { left: 10px; }
.ad-control > svg.lucide:last-child:not(:first-child) { right: 10px; }
.ad-control--lead .ad-input { padding-left: 32px; }
.ad-control--select .ad-select { appearance: none; -webkit-appearance: none; padding-right: 30px; cursor: pointer; }
.ad-control--select > svg.lucide { right: 10px; left: auto; }

/* ---------- 필터 줄 ---------- */
.ad-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.ad-toolbar .ad-control { width: 200px; }
.ad-toolbar .ad-control--wide { width: 280px; }
.ad-toolbar__end { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }

/* ---------- 기간 선택(세그먼트) ---------- */
.ad-seg { display: inline-flex; border: 1px solid var(--line-control); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
.ad-seg button {
  height: calc(var(--control-height) - 2px); padding: 0 var(--space-3);
  border: 0; border-right: 1px solid var(--line); background: transparent;
  color: var(--ink-muted); font: 500 13px/1 var(--font-sans); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.ad-seg button:last-child { border-right: 0; }
.ad-seg button:hover { background: var(--surface-muted); color: var(--ink); }
.ad-seg button[aria-pressed="true"], .ad-seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ad-seg svg.lucide { width: 14px; height: 14px; }

/* ---------- Badge ---------- */
.ad-badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  height: 22px; padding: 0 8px; border-radius: var(--radius-sm);
  font-size: 12px; line-height: 1; font-weight: 500; white-space: nowrap;
  background: var(--neutral-soft); color: var(--neutral);
}
.ad-badge svg.lucide { width: 13px; height: 13px; stroke-width: 2; }
.ad-badge--success { background: var(--success-soft); color: var(--success); }
.ad-badge--warning { background: var(--warning-soft); color: var(--warning); }
.ad-badge--danger { background: var(--danger-soft); color: var(--danger); }
.ad-badge--info { background: var(--accent-soft); color: var(--accent); }
.ad-badge--outline { background: transparent; border: 1px solid var(--line-control); color: var(--ink-muted); }
.ad-badge--lg { height: 26px; padding: 0 10px; font-size: 13px; }
.ad-badge .spin { animation: ad-spin 1.2s linear infinite; }
@keyframes ad-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ad-badge .spin { animation: none; } }

/* ---------- 패널 ---------- */
.ad-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); min-width: 0; }
.ad-panel__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 14px var(--space-4); border-bottom: 1px solid var(--line); }
.ad-panel__head h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
.ad-panel__head p { margin: 0; font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.ad-panel__body { padding: var(--space-4); }
.ad-panel__body--flush { padding: 0; }
.ad-section-label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-muted); }

/* ---------- KPI ---------- */
.ad-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: var(--space-3); }
.ad-kpi { display: flex; flex-direction: column; gap: 6px; padding: var(--space-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); min-width: 0; }
.ad-kpi__label { display: flex; align-items: center; gap: var(--space-1); font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-muted); }
.ad-kpi__label svg.lucide { width: 14px; height: 14px; }
.ad-kpi__value { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em; }
.ad-kpi__value small { margin-left: 2px; font-size: 14px; font-weight: 500; color: var(--ink-muted); letter-spacing: 0; }
.ad-kpi__sub { font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.ad-kpi--empty .ad-kpi__value { color: var(--ink-muted); }

/* ---------- 표 ---------- */
.ad-table-wrap { overflow-x: auto; }
.ad-table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; }
.ad-table th {
  padding: 8px var(--space-3); text-align: left; white-space: nowrap;
  background: var(--surface-muted); color: var(--ink-muted);
  font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.02em;
  border-bottom: 1px solid var(--line);
}
.ad-table th[aria-sort] { color: var(--ink); }
.ad-table th svg.lucide { width: 12px; height: 12px; vertical-align: -1px; margin-left: 2px; }
.ad-table td { padding: 10px var(--space-3); border-bottom: 1px solid var(--line); vertical-align: middle; }
.ad-table tbody tr:last-child td { border-bottom: 0; }
.ad-table tr.is-link { cursor: pointer; }
.ad-table tr.is-link:hover td { background: var(--surface-muted); }
.ad-table tr[aria-selected="true"] td { background: var(--accent-soft); }
.ad-table .cell-strong { font-weight: 600; }
.ad-table .cell-sub { display: block; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.ad-tablefoot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 10px var(--space-3); border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-muted); }
.ad-tablefoot .ad-control--select { width: 116px; }
.ad-tablefoot .ad-select { height: 28px; font-size: 12px; }
.ad-pager { display: flex; align-items: center; gap: 2px; }
.ad-pager button {
  min-width: 28px; height: 28px; padding: 0 6px;
  border: 0; border-radius: var(--radius-md); background: transparent;
  color: var(--ink-muted); font: 500 12px/1 var(--font-sans); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.ad-pager button:hover { background: var(--surface-muted); color: var(--ink); }
.ad-pager button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ad-pager button:disabled { opacity: 0.45; cursor: not-allowed; }
.ad-resultline { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 10px var(--space-3); font-size: 12px; color: var(--ink-muted); border-bottom: 1px solid var(--line); }

/* ---------- 서비스 상태 ---------- */
.ad-status { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.ad-overall { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.ad-overall__icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--neutral-soft); color: var(--neutral); }
.ad-overall__icon svg.lucide { width: 24px; height: 24px; stroke-width: 2; }
.ad-overall__icon--success { background: var(--success-soft); color: var(--success); }
.ad-overall__icon--warning { background: var(--warning-soft); color: var(--warning); }
.ad-overall__icon--danger { background: var(--danger-soft); color: var(--danger); }
.ad-overall__title { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; }
.ad-overall__desc { margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-muted); }

/* ---------- Drawer ---------- */
.ad-scrim { position: fixed; inset: 0; background: var(--scrim); }
.ad-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: var(--drawer-width); max-width: 100%;
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-drawer);
}
.ad-drawer--wide { width: 520px; }
.ad-drawer__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--line); }
.ad-drawer__eyebrow { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-muted); }
.ad-drawer__title { margin: 2px 0 0; font-size: 15px; line-height: 22px; font-weight: 600; }
.ad-drawer__body { flex: 1; overflow-y: auto; padding: var(--space-2) var(--space-5) var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
.ad-drawer__foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-5); border-top: 1px solid var(--line); }
.ad-dl { display: grid; grid-template-columns: 128px minmax(0, 1fr); margin: 0; }
.ad-dl dt, .ad-dl dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 20px; }
.ad-dl dt { color: var(--ink-muted); }
.ad-dl dd { min-width: 0; }
.ad-dl dd.mono { overflow-wrap: anywhere; }
.ad-dl > :nth-last-child(-n+2) { border-bottom: 0; }

/* ---------- Modal ---------- */
.ad-modal-layer { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--space-4); background: var(--scrim); }
.ad-modal { width: 440px; max-width: 100%; display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-5); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); }
.ad-modal h2 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
.ad-modal p { margin: 0; font-size: 14px; line-height: 21px; }
.ad-modal__foot { display: flex; justify-content: flex-end; gap: var(--space-2); }

/* ---------- 탭 ---------- */
.ad-tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--line); }
.ad-tab {
  height: 40px; padding: 0 var(--space-3); margin-bottom: -1px;
  border: 0; border-bottom: 2px solid transparent; background: transparent;
  color: var(--ink-muted); font: 500 13.5px/1 var(--font-sans); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.ad-tab:hover { color: var(--ink); }
.ad-tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.ad-tab .count { font-size: 12px; color: var(--ink-muted); font-weight: 500; }
.ad-langtab .done { color: var(--success); }
.ad-langtab .todo { color: var(--warning); }

/* ---------- 파일 등록 ---------- */
.ad-drop { display: grid; place-items: center; gap: var(--space-2); padding: var(--space-6); border: 1px dashed var(--line-control); border-radius: var(--radius-lg); background: var(--surface-muted); text-align: center; color: var(--ink-muted); font-size: 13px; }
.ad-drop svg.lucide { width: 20px; height: 20px; }
.ad-files { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-lg); }

  FORMS.m11 = function () { var f = state.m11; f.who = $("#m11-who").value.trim(); f.area = $("#m11-area").value; f.result = $("#m11-result").value; f.ip = $("#m11-ip") ? $("#m11-ip").value.trim() : ""; f.from = $("#m11-from").value; f.to = $("#m11-to").value; f.page = 1; f.searched = !!(f.who || f.area || f.result || f.ip || f.from || f.to); render(); };
  DRAWERS.aud = function (d) {
    var r = AUDIT.filter(function (x) { return x.k === d.k; })[0]; if (!r) return "";
    return drawerShell("감사 상세", r.type + " · " + r.target, '<dl class="ad-dl"><dt>작업일시</dt><dd class="mono">' + ymd(r.at) + " " + hm(r.at) + ":" + pad(r.at.getSeconds()) + "</dd><dt>작업자</dt><dd>" + NAME(r.who) + "</dd><dt>작업영역</dt><dd>" + r.area + "</dd><dt>작업유형</dt><dd>" + r.type + "</dd><dt>작업대상</dt><dd>" + esc(r.target) + "</dd><dt>처리결과</dt><dd>" + r.result + "</dd></dl>" +
      '<div><div class="ad-section-label" style="margin-bottom:6px">변경 내용</div><dl class="ad-dl"><dt>변경항목</dt><dd>' + esc(r.item) + "</dd><dt>변경 전</dt><dd>" + esc(r.before) + "</dd><dt>변경 후</dt><dd>" + esc(r.after) + '</dd></dl></div><dl class="ad-dl"><dt>작업자 접속 IP</dt><dd class="mono">' + r.ip + '</dd><dt>연계 식별자</dt><dd class="mono">' + r.link + "</dd></dl>" +
      (r.area === "콘텐츠 관리" ? '<div class="ad-notice">' + ic("info") + "<span>콘텐츠 본문의 변경 전후 값은 콘텐츠 변경이력(SCR-M05)에서 확인합니다.</span></div>" : ""), '<button class="ad-btn" type="button" data-act="close">닫기</button>');
  };
  DRAWERS.acc = function (d) {
    var r = ACCESS.filter(function (x) { return x.k === d.k; })[0]; if (!r) return "";
    return drawerShell("접근 상세", r.type + " · " + r.result, '<dl class="ad-dl"><dt>발생일시</dt><dd class="mono">' + ymd(r.at) + " " + hm(r.at) + ":" + pad(r.at.getSeconds()) + "</dd><dt>계정 ID</dt><dd>" + (r.acc ? '<span class="mono">' + r.acc + "</span>" : "확인 불가 <span class=\"muted\">(입력값 " + esc(r.typed) + ")</span>") + '</dd><dt>접속 IP</dt><dd class="mono">' + r.ip + "</dd><dt>접근유형</dt><dd>" + r.type + "</dd><dt>처리결과</dt><dd>" + r.result + "</dd><dt>사유</dt><dd>" + (r.reason || "—") + "</dd></dl>", '<button class="ad-btn" type="button" data-act="close">닫기</button>');
  };
  DO.drawer = function (arg) { var p = arg.split(":"), k = p[1]; lastFocus = document.activeElement; state.drawer = { kind: p[0], k: /^\d+$/.test(k) ? +k : k }; render(); var t = $("#dw-title"); if (t) t.focus(); };


  // ---------- 준비 중 ----------
  function pending(id) {
    return pageHead(LABEL[id], "이 화면은 다음 차수 프로토타입에서 만듭니다", "") + '<section class="ad-panel"><div class="ad-empty"><div class="ad-empty__icon">' + ic("construction") + "</div><h3>" + LABEL[id] + ' 화면 준비 중</h3><p>이번 차수에는 역할별 기본 진입화면 3개(관람·이용현황, 서비스 운영현황, 시스템 현황)만 들어 있습니다.</p><a class="ad-btn ad-btn--primary" href="#' + ROLES[state.role].home + '">' + ic("arrow-left") + "기본 진입화면으로</a></div></section>";
  }

  // ---------- Drawer ----------
  function drawerShell(eyebrow, title, body, foot, wide) {
    return '<div class="ad-scrim" data-act="close"></div><aside class="ad-drawer' + (wide ? ' ad-drawer--wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="dw-title"><div class="ad-drawer__head"><div><div class="ad-drawer__eyebrow">' + eyebrow + '</div><h2 class="ad-drawer__title" id="dw-title" tabindex="-1">' + esc(title) + '</h2></div><button class="ad-btn ad-btn--ghost ad-btn--icon" type="button" aria-label="닫기" data-act="close">' + ic("x") + '</button></div><div class="ad-drawer__body">' + body + '</div><div class="ad-drawer__foot">' + foot + "</div></aside>";
  }

  // ---------- 렌더 ----------
  var lastFocus = null;
  function render() {
    var R = ROLES[state.role];
    SCREENS.m02 = m02; SCREENS.m09 = m09; SCREENS.m12 = m12;
    $(".app").hidden = !!state.loggedOut; $("#login").hidden = !state.loggedOut;
    $("#role-seg").innerHTML = Object.keys(ROLES).map(function (k) { return '<button type="button" data-role="' + k + '" aria-pressed="' + (state.role === k) + '">' + ROLES[k].label + "</button>"; }).join("");
    $("#user").innerHTML = '<span class="mono">' + R.id + '</span><span class="ad-badge ad-badge--outline">' + R.label + '</span><button class="ad-btn ad-btn--ghost ad-btn--sm" type="button" data-act="logout">' + ic("log-out") + "로그아웃</button>";
    $("#brand").setAttribute("href", "#" + R.home);
    $("#nav").innerHTML = navHtml();
    var s = state.screen;
    // 로그인 화면에서는 시연용으로 임시 비밀번호가 발급된 계정의 ID·임시 비밀번호를 상단 바에 보여 준다
    var tmpA = ACCOUNTS.filter(function (a) { return a.temp; }), ta = $("#temp-accts");
    ta.hidden = !state.loggedOut || !tmpA.length;
    ta.innerHTML = ic("key-round") + "<span>임시 비밀번호 계정</span>" + tmpA.map(function (a) { return '<span><span class="mono">' + a.id + '</span> / <span class="mono">' + a.temp + "</span></span>"; }).join('<span class="muted">·</span>');
    if (state.loggedOut) { $("#login").innerHTML = loginScreen(); $("#main").innerHTML = ""; s = "m01"; }
    else {
      $("#login").innerHTML = ""; $("#main").innerHTML = SCREENS[s] ? SCREENS[s]() : pending(s);
      // 기본 진입화면(m02·m09·m12)은 화면 함수에 안내 영역이 없어 제목 아래에 붙인다
      var ph = $("#main .ad-pagehead"); if (/^m(02|09|12)$/.test(s) && ph && flash(s)) ph.insertAdjacentHTML("afterend", flash(s));
    }
    var ml = $("#modal"); if (state.modal && MODALS[state.modal.kind]) { ml.innerHTML = '<div class="ad-modal-layer">' + MODALS[state.modal.kind]() + '</div>'; ml.hidden = false; } else { ml.innerHTML = ""; ml.hidden = true; }
    var layer = $("#layer");
    if (state.drawer) { layer.innerHTML = state.drawer.kind ? DRAWERS[state.drawer.kind](state.drawer) : state.drawer.id ? m02Drawer(state.drawer.id) : m09Drawer(state.drawer.err); layer.hidden = false; }
    else { layer.innerHTML = ""; layer.hidden = true; }
    document.title = LABEL[s] + " · 문화관람 관리자";
    if (window.lucide) window.lucide.createIcons();
    if (state.modal) { var af = $("#modal [autofocus]"); if (af) af.focus(); }
  }
  function go(screen) {
    if (!LABEL[screen]) screen = ROLES[state.role].home;
    if (ROLES[state.role].menus.indexOf(screen === "m04" ? "m03" : screen) < 0) screen = ROLES[state.role].home;
    if (screen === "m04" && !state.m04) screen = "m03";
    if (state.screen === "m04" && screen !== "m04" && state.m04 && state.m04.dirty && !state.leaveOk) { state.modal = { kind: "discard" }; state.pendingGo = screen; render(); return; }
    state.leaveOk = false; state.screen = screen; state.drawer = null; state.modal = null; state.flash = null; render(); window.scrollTo(0, 0);
  }
  function openDrawer(d) { lastFocus = document.activeElement; state.drawer = d; render(); var t = $("#dw-title"); if (t) t.focus(); }
  function closeDrawer() { state.drawer = null; render(); if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }

  document.addEventListener("click", function (ev) {
    var dd = ev.target.closest("[data-do]");
    if (dd && !dd.disabled) { ev.preventDefault(); DO[dd.dataset.do](dd.dataset.arg, dd, ev); return; }
    var t = ev.target.closest("[data-role],[data-nav],[data-period],[data-act],[data-page],[data-exhibit],[data-svc],[data-err],a[href^='#']");
    if (!t) return;
    if (t.dataset.role) { state.loggedOut = false; state.m04 = null; state.role = t.dataset.role; state.period = "7d"; go(ROLES[state.role].home); try { history.replaceState(null, "", "#" + state.screen); } catch (e) {} return; }
    if (t.dataset.nav || (t.tagName === "A" && t.getAttribute("href").length > 1)) { ev.preventDefault(); var id = t.dataset.nav || t.getAttribute("href").slice(1); go(id); try { history.replaceState(null, "", "#" + state.screen); } catch (e) {} return; }
    if (t.dataset.period) { state.period = t.dataset.period; state.m02page = 1; state.m09page = 1; render(); return; }
    if (t.dataset.page) { var p = t.dataset.page.split(":"); if (state[p[0]] && typeof state[p[0]] === "object") state[p[0]].page = +p[1]; else state[p[0] + "page"] = +p[1]; render(); return; }
    if (t.dataset.exhibit) { openDrawer({ id: t.dataset.exhibit }); return; }
    if (t.dataset.svc) { state.m09svc = state.m09svc === t.dataset.svc ? "" : t.dataset.svc; state.m09page = 1; render(); return; }
    if (t.dataset.err) { openDrawer({ err: +t.dataset.err }); return; }
    var a = t.dataset.act;
    if (a === "close") closeDrawer();
    else if (a === "query") { var f = $("#p-from"), to = $("#p-to"); if (f && to) { state.from = f.value; state.to = to.value; } render(); }
    else if (a === "refresh") { state.checked = new Date(state.checked.getTime() + 60e3); render(); }
    else if (a === "collect") { state.collected = new Date(state.collected.getTime() + 60e3); render(); }
    else if (a === "m02reset") { state.m02q = ""; state.m02cat = ""; state.m02page = 1; render(); }
    else if (a === "m09reset") { state.m09svc = ""; state.m09type = ""; state.m09page = 1; render(); }
    else if (a === "logout") { ACCESS.unshift({ k: 7000 + ACCESS.length, at: now(), acc: me(), typed: me(), type: "로그아웃", ip: "192.168.10.21", result: "성공", reason: "" }); state.loggedOut = true; state.loginError = ""; state.loginId = ""; state.drawer = null; state.modal = null; render(); }
  });
  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var fm = ev.target.dataset.form; if (fm && FORMS[fm]) { FORMS[fm](ev.target); return; }
    if (ev.target.dataset.form === "m02") { state.m02q = $("#m02-q").value; state.m02cat = $("#m02-cat").value; state.m02page = 1; render(); }
  });
  document.addEventListener("input", function (ev) {
    var b = ev.target.dataset && ev.target.dataset.bind; if (b && state.m04) { setPath(state.m04.draft, b, ev.target.value); state.m04.dirty = true; }
    var fb = ev.target.dataset && ev.target.dataset.fbind; if (fb && state.drawer && state.drawer.form) state.drawer.form[fb] = ev.target.value;
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.dataset && ev.target.dataset.bind && state.m04 && ev.target.tagName === "SELECT") { setPath(state.m04.draft, ev.target.dataset.bind, ev.target.value); state.m04.dirty = true; render(); return; }
    if (ev.target.dataset && ev.target.dataset.fbind && state.drawer && state.drawer.form) { state.drawer.form[ev.target.dataset.fbind] = ev.target.value; return; }
    if (ev.target.id === "f-rel" && ev.target.value) { state.m04.draft.related.push(ev.target.value); state.m04.dirty = true; render(); return; }
    if (ev.target.id === "f-img") { Array.prototype.forEach.call(ev.target.files, function (fl) { state.m04.draft.images.push({ file: fl.name, kind: state.m04.draft.images.some(function (i) { return i.kind === "대표"; }) ? "추가" : "대표", size: (fl.size / 1048576).toFixed(1) + "MB" }); }); state.m04.dirty = true; render(); return; }
    if (ev.target.id === "m06-type") { state.m06.type = ev.target.value; state.m06.page = 1; render(); return; }
    if (ev.target.id === "m09-svc") { state.m09svc = ev.target.value; state.m09page = 1; render(); }
    if (ev.target.id === "m09-type") { state.m09type = ev.target.value; state.m09page = 1; render(); }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && state.modal) { state.modal = null; render(); return; }
    if (ev.key === "Escape" && state.drawer) closeDrawer();
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("tr.is-link")) { ev.preventDefault(); ev.target.click(); }
  });

  var h = (location.hash || "").slice(1);
  if (h === "m01") state.loggedOut = true;
  if (h === "m03" || h === "m05" || h === "m06" || h === "m07" || h === "m08") state.role = "A2"; else if (h === "m10" || h === "m11") state.role = "A4";
  if (h === "m02") state.role = "A2"; else if (h === "m12") state.role = "A4";
  state.screen = LABEL[h] && ROLES[state.role].menus.indexOf(h) >= 0 ? h : ROLES[state.role].home;
  render();
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js";
  s.onload = function () { window.lucide.createIcons(); };
  document.head.appendChild(s);
  new MutationObserver(function () { if (window.lucide && document.querySelector("i[data-lucide]")) window.lucide.createIcons(); }).observe(document.body, { childList: true, subtree: true });
})();

</script>
</body></html>
